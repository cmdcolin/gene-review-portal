<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>__TITLE__</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>&#129516;</text></svg>"
    />
    <style>
      /* Surfaces, text and borders are CSS system colors, so light and dark
         both work with no palette and no media query — the browser maps
         Canvas/Field/ButtonFace per scheme. Only the accents that carry meaning
         are fixed: one colour per class, one per verdict. */
      :root {
        color-scheme: light dark;
        /* light-dark() rather than a media query, for the same reason the rest
           of the sheet is system colors: one declaration, both schemes. An
           accent picked for white is unreadable on near-black and the other way
           round, and these are borders and text, not decoration. */
        --accent: light-dark(#2563eb, #7aa2f7);
        --keep: light-dark(#16a34a, #4ade80);
        --edit: light-dark(#b45309, #fbbf24);
        --reject: light-dark(#dc2626, #f87171);
        /* what reads on top of an accent, once the accent is the background */
        --on-accent: light-dark(#fff, #10131a);
      }
      [data-cls='merge'] {
        --cls: light-dark(#7c3aed, #c4b5fd);
      }
      [data-cls='structure-conflict'] {
        --cls: light-dark(#b45309, #fbbf24);
      }
      [data-cls='novel-locus'] {
        --cls: light-dark(#0d9488, #5eead4);
      }
      [data-cls='novel-coding'] {
        --cls: light-dark(#2563eb, #93b4fc);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: Canvas;
        color: CanvasText;
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 14px;
        line-height: 1.5;
      }

      /* Full width and stuck to the top of the viewport, not a floating panel
         inside the column: every control on the page is in here, and a reviewer
         forty cards down needs all of them without scrolling back. */
      header {
        position: sticky;
        top: 0;
        z-index: 10;
        background: Canvas;
        border-bottom: 1px solid ButtonBorder;
        padding: 10px 20px;
        display: flex;
        gap: 8px 16px;
        align-items: center;
        flex-wrap: wrap;
      }
      header h1 {
        font-size: 16px;
        margin: 0;
      }
      .eyebrow {
        font-size: 12px;
        color: GrayText;
      }
      .counts {
        margin-left: auto;
        display: flex;
        gap: 14px;
        font-size: 13px;
        color: GrayText;
      }
      .counts b {
        color: CanvasText;
        font-variant-numeric: tabular-nums;
      }
      .progress {
        width: 230px;
        display: flex;
        flex-direction: column;
        gap: 3px;
      }
      .progress .r {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        font-size: 12px;
        color: GrayText;
      }
      .bar {
        height: 6px;
        display: flex;
        border: 1px solid ButtonBorder;
        border-radius: 3px;
        background: ButtonFace;
        overflow: hidden;
      }
      .bar span {
        height: 100%;
      }
      .b-keep {
        background: var(--keep);
      }
      .b-edit {
        background: var(--edit);
      }
      .b-reject {
        background: var(--reject);
      }

      /* the filters and the actions, on their own line under the title row */
      .hrow {
        flex-basis: 100%;
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      .filters {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .actions {
        margin-left: auto;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      button,
      select,
      input[type='search'] {
        font: inherit;
        font-size: 13px;
        padding: 5px 10px;
        border: 1px solid ButtonBorder;
        border-radius: 6px;
        background: Canvas;
        color: CanvasText;
      }
      select,
      input[type='search'] {
        background: Field;
        color: FieldText;
      }
      input[type='search'] {
        min-width: 190px;
      }
      button {
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
        color: GrayText;
      }
      .filters button[aria-pressed='true'] {
        background: var(--cls, var(--accent));
        border-color: var(--cls, var(--accent));
        color: var(--on-accent);
      }
      /* 9 → 10 → 100 all draw in the same box, so a verdict does not reflow the
         row and move every card on the page */
      .filters .count {
        display: inline-block;
        min-width: 3ch;
        text-align: right;
        margin-left: 6px;
        opacity: 0.7;
        font-size: 12px;
        font-variant-numeric: tabular-nums;
      }
      .msg {
        font-size: 13px;
        color: GrayText;
      }

      /* `hidden` is a UA rule, and any author `display` beats it whatever the
         specificity — without this the legend shows whether or not it is open */
      .keys {
        flex-basis: 100%;
        display: flex;
        flex-wrap: wrap;
        gap: 4px 20px;
        align-items: center;
        font-size: 12px;
        color: GrayText;
      }
      .keys[hidden] {
        display: none;
      }
      .keys kbd {
        font-family: ui-monospace, monospace;
        font-size: 11px;
        color: CanvasText;
        background: ButtonFace;
        border: 1px solid ButtonBorder;
        border-radius: 4px;
        padding: 0 5px;
        margin-right: 3px;
      }

      main {
        max-width: 1400px;
        margin: 0 auto;
        padding: 20px 20px 40vh;
        display: flex;
        flex-direction: column;
        gap: 18px;
      }
      .lede {
        max-width: 78ch;
        margin: 0;
        color: GrayText;
      }
      .lede strong {
        color: CanvasText;
      }

      .cards {
        display: flex;
        flex-direction: column;
        gap: 18px;
      }
      /* The class stripe is always 5px and only its COLOUR says which class: a
         border is layout, so growing one on a verdict would reflow the card. */
      .card {
        border: 1px solid var(--verdict, ButtonBorder);
        border-left: 5px solid var(--cls, ButtonBorder);
        border-radius: 8px;
        overflow: hidden;
      }
      .card[data-verdict='keep'] {
        --verdict: var(--keep);
      }
      .card[data-verdict='edit'] {
        --verdict: var(--edit);
      }
      .card[data-verdict='reject'] {
        --verdict: var(--reject);
      }
      .card[data-current='true'] {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .card-head {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 14px;
        align-items: baseline;
        padding: 10px 14px;
        border-bottom: 1px solid ButtonBorder;
      }
      .chip {
        padding: 1px 8px;
        border-radius: 999px;
        background: var(--cls, var(--accent));
        color: var(--on-accent);
        font-size: 12px;
        font-weight: 500;
        white-space: nowrap;
      }
      .model {
        font-family: ui-monospace, monospace;
        font-size: 13px;
      }
      .genes {
        font-weight: 600;
      }
      .meta {
        margin-left: auto;
        font-family: ui-monospace, monospace;
        font-size: 12px;
        color: GrayText;
        font-variant-numeric: tabular-nums;
      }
      .why {
        padding: 10px 14px 0;
        color: GrayText;
        max-width: 78ch;
      }
      .detail {
        padding: 4px 14px 0;
        font-size: 13px;
        max-width: 78ch;
      }
      .detail .j {
        font-family: ui-monospace, monospace;
        font-size: 12px;
        color: GrayText;
      }
      .shot {
        display: block;
        width: 100%;
        height: auto;
        margin-top: 10px;
        border-top: 1px solid ButtonBorder;
        border-bottom: 1px solid ButtonBorder;
        background: #fff;
      }
      .missing {
        margin-top: 10px;
        padding: 20px 14px;
        border-top: 1px solid ButtonBorder;
        border-bottom: 1px solid ButtonBorder;
        color: GrayText;
        font-size: 13px;
      }
      .card-foot {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 14px;
        align-items: center;
        padding: 10px 14px;
      }
      .verdicts {
        display: flex;
        gap: 6px;
      }
      .verdicts button[data-v='keep'] {
        border-color: var(--keep);
        color: var(--keep);
      }
      .verdicts button[data-v='edit'] {
        border-color: var(--edit);
        color: var(--edit);
      }
      .verdicts button[data-v='reject'] {
        border-color: var(--reject);
        color: var(--reject);
      }
      .verdicts button[aria-pressed='true'] {
        color: var(--on-accent);
      }
      .verdicts button[aria-pressed='true'][data-v='keep'] {
        background: var(--keep);
      }
      .verdicts button[aria-pressed='true'][data-v='edit'] {
        background: var(--edit);
      }
      .verdicts button[aria-pressed='true'][data-v='reject'] {
        background: var(--reject);
      }
      .next {
        font-size: 13px;
        color: GrayText;
      }
      .next b {
        color: CanvasText;
      }
      .links {
        margin-left: auto;
        display: flex;
        gap: 8px;
      }
      a.live {
        font-size: 13px;
        color: LinkText;
        text-decoration: none;
        border: 1px solid ButtonBorder;
        border-radius: 6px;
        padding: 5px 12px;
        white-space: nowrap;
      }
      a.live.apollo {
        border-color: var(--accent);
      }
      .empty {
        color: GrayText;
        align-self: flex-start;
      }
      footer {
        border-top: 1px solid ButtonBorder;
        padding-top: 16px;
        color: GrayText;
        font-size: 13px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        max-width: 78ch;
      }
      footer code {
        font-family: ui-monospace, monospace;
        font-size: 12px;
        color: CanvasText;
      }
      @media (max-width: 700px) {
        .counts,
        .progress,
        .actions,
        .meta,
        .links {
          margin-left: 0;
        }
        .progress {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">__APP_HTML__</div>
    <script id="portal-data" type="application/json">
      __DATA__
    </script>
    <script>
      __APP_JS__
    </script>
  </body>
</html>
